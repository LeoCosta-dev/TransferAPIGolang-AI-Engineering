name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v-qa*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - account
          - transactions

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: services/${{ matrix.service }}

      - name: Vulnerability Check
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.27.1"
          go-package: ./...
          work-dir: services/${{ matrix.service }}
          repo-checkout: false

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race
        run: go test -race ./...

  # ============================================================
  # Secret scanning — roda em todos os pushes, antes de qualquer deploy.
  # Gitleaks escaneia o histórico completo (fetch-depth: 0) + working tree.
  # ============================================================

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: false

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0

      - name: Run Gitleaks
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          gitleaks git --exit-code=1 --redact

  # ============================================================
  # QA
  # Trigger: v-qaX.Y.Z
  # Can be created from ANY branch
  # Example: v-qa0.0.1
  # ============================================================

  build-and-push-qa:
    name: Build and Push QA Images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v-qa')
    needs: [test, secret-scan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push account QA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/account/Dockerfile
          push: true
          tags: |
            ghcr.io/leocosta-dev/transferapigolang-account:qa
            ghcr.io/leocosta-dev/transferapigolang-account:${{ github.ref_name }}

      - name: Build and push transactions QA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/transactions/Dockerfile
          push: true
          tags: |
            ghcr.io/leocosta-dev/transferapigolang-transactions:qa
            ghcr.io/leocosta-dev/transferapigolang-transactions:${{ github.ref_name }}

  deploy-qa:
    name: Deploy QA
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v-qa')
    needs: build-and-push-qa
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload QA compose
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          passphrase: ${{ secrets.OCI_SSH_PASSPHRASE }}
          source: "docker-compose.qa.yml"
          target: "~/transfer-api"

      - name: Deploy QA
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          passphrase: ${{ secrets.OCI_SSH_PASSPHRASE }}
          script: |
            set -e

            cd ~/transfer-api

            docker compose -p transfer-api -f docker-compose.qa.yml pull
            docker compose -p transfer-api -f docker-compose.qa.yml up -d --remove-orphans

            sleep 5

            curl --fail --silent --show-error http://localhost:9088/health
            curl --fail --silent --show-error http://localhost:9089/health

            docker image prune -f

  # ============================================================
  # PRODUCTION
  # Trigger: vX.Y.Z
  # MUST point to a commit in main
  # Example: v0.0.1
  # ============================================================

  verify-production-source:
    name: Verify Production Source
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/v-qa')
    needs: [test, secret-scan]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        run: |
          set -e

          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "ERROR: Production tags must point to a commit in main."
            echo "Tag: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            exit 1
          fi

          echo "Production tag is based on main."

  build-and-push-production:
    name: Build and Push Production Images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/v-qa')
    needs: verify-production-source

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push account Production
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/account/Dockerfile
          push: true
          tags: |
            ghcr.io/leocosta-dev/transferapigolang-account:${{ github.ref_name }}
            ghcr.io/leocosta-dev/transferapigolang-account:latest

      - name: Build and push transactions Production
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/transactions/Dockerfile
          push: true
          tags: |
            ghcr.io/leocosta-dev/transferapigolang-transactions:${{ github.ref_name }}
            ghcr.io/leocosta-dev/transferapigolang-transactions:latest

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/v-qa')
    needs: build-and-push-production
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload production compose
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          passphrase: ${{ secrets.OCI_SSH_PASSPHRASE }}
          source: "docker-compose.prod.yml"
          target: "~/transfer-api"

      - name: Deploy Production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          passphrase: ${{ secrets.OCI_SSH_PASSPHRASE }}
          script: |
            set -e

            cd ~/transfer-api

            docker compose -p transfer-api-prod -f docker-compose.prod.yml pull
            docker compose -p transfer-api-prod -f docker-compose.prod.yml up -d --remove-orphans

            sleep 5

            curl --fail --silent --show-error http://localhost:8088/health
            curl --fail --silent --show-error http://localhost:8089/health

            docker image prune -f